<script>const DATA={"chapters":[{"id":1,"title":"国际商法绪论","subtitle":"国际商事关系、法律渊源、两大法系与中国法律制度","lessons":[["国际商法的概念与调整对象","国际商法是调整国际商事交易和商事组织各种关系的法律规范总合。概念有两个层次：第一，它是由国家制定或认可、并由国家强制力保障实施的法律规范体系；第二，它调整具有跨境因素的商事关系。这里的“国际”主要指不同国家或法域的商事主体之间的关系，而不是国家之间的政治、外交关系。","商事关系可分为商事组织关系与商事交易关系。传统商法主要关注有形商品交易；现代国际商事活动还包括技术转让、国际投资、国际融资、知识产权许可、跨境服务和电子商务。判断一项关系是否属于国际商法研究范围，应先识别主体营业地、交易跨境因素、交易性质和争议所涉法律关系。","例：甲公司营业地在中国，乙公司营业地在德国，双方订立设备买卖合同，属于典型国际货物买卖关系；若两国政府就关税政策谈判，则主要属于国际公法或国际经济法范畴。","易错：国际商法不是单一法典，也不等于国际公法。它由国际条约、国际惯例、国内法和判例等不同层次规则共同构成。"],["国际商法的历史发展与四大渊源","课程提纲将发展概括为四阶段：古罗马时期的商法规范萌芽；11世纪地中海贸易繁荣后商人习惯法发展；16世纪商法逐渐纳入各国国内法；二战后国际贸易扩张推动国际商法重新统一化。","四大渊源：国际条约、国际惯例、国内立法、国内判例。CISG是国际货物销售合同领域的重要统一法公约；Incoterms®解释贸易术语中交货、风险、费用与义务分配；UCP主要规范跟单信用证业务。国内法和判例则在公约未调整事项、合同效力、物权转移、程序和救济等方面发挥作用。","适用顺序不是简单地“国际法永远优先”。需要先查合同是否选择法律、是否排除或变更公约、争议解决地的冲突规范、相关条约的适用条件，以及强制性规范。","易错：国际惯例并非因“常见”就当然适用；应考察当事人是否约定、是否形成双方习惯做法，或相关公约是否规定适用。"],["大陆法系与英美法系","大陆法系以罗马法为历史基础，以法国法、德国法为代表，强调成文法典、抽象概念和体系化规则；英美法系以英国普通法传统为基础，判例法在法律发展中具有重要地位，并形成普通法与衡平法的历史区分。","大陆法系通常以公法与私法的体系分类、法典编纂和法律条文解释为核心；英美法系强调判例先例、诉讼对抗结构和具体案件中的规则提炼。两大法系并非静止对立：大陆法国家重视判例指导，英美法国家也大量制定成文法，表现为相互借鉴但并未完全融合。","课程内容关于英国判决“理由”与“事实”的区分，核心是识别 ratio decidendi（判决理由中对裁判必要的法律规则）与 obiter dicta（附带意见）。并非判决中的所有文字都具有同等先例效力。","易错：美国联邦制下要区分联邦法与州法；不能把美国法院体系简单理解为单一垂直系统。"],["中国法律制度与涉外商事规则","课程内容从法律沿革、法律渊源、法律部门和司法制度四方面介绍中国法律制度。当前涉外商事争议通常需要结合《民法典》《公司法》《合伙企业法》《海商法》《保险法》以及涉外民事关系法律适用规则分析。","我国法源以宪法、法律、行政法规、地方性法规、规章及依法具有约束力的规范为核心。司法解释对裁判适用具有重要作用；指导性案例和人民法院案例库案例具有参照、检索和统一裁判尺度的价值，但我国并非普通法意义上的严格遵循先例制度。","案例分析时应按“争议关系—管辖/法律适用—实体规则—救济”四步推进。国际条约适用还应核对我国是否为缔约方、是否作出保留，以及条约是否覆盖争议事项。","资料更新提示：课件中关于法院数量、人员编制、历史法条编号等内容可能随制度改革变化，应以现行官方资料为准。"]],"law":"《民法典》；《涉外民事关系法律适用法》；CISG；Incoterms® 2020；UCP 600。注意区分国际条约、国际惯例与国内制定法的效力基础。"},{"id":2,"title":"公司法与合伙企业法","subtitle":"商事组织形式、公司人格、资本制度、治理与合伙责任","lessons":[["商事组织形式：个人独资、合伙与公司","课程内容以组织结构与责任形态作比较：个人独资企业以自然人投资为基础，投资人对企业债务承担无限责任；合伙企业以合伙协议和合伙人共同经营为基础，普通合伙人原则上承担无限连带责任；公司具有独立法人资格，公司以其全部财产对公司债务承担责任，股东通常以认缴出资额或认购股份为限承担责任。","区分组织形式时要同时观察：是否具有法人资格、财产是否独立、投资人责任是否有限、内部决策机制、对外代表规则、利润分配和退出机制。有限责任并不意味着股东在任何情形下都免责，出资瑕疵、违法抽逃出资、人格混同、滥用控制权等可能引发额外责任。","例：有限责任公司无力清偿债务，不当然意味着股东以个人财产清偿；但股东未按期足额出资，或滥用法人独立地位逃避债务并严重损害债权人利益，可能承担法定责任。","易错：公司法人财产独立与股东有限责任是两个相互联系但不完全相同的制度命题。"],["公司概念、法人格独立与揭开公司面纱","公司是依法设立的企业法人，具有独立法人财产和法人财产权。公司以其全部财产对公司债务承担责任。公司人格独立有利于资本集合、风险分散和交易安全。","揭开公司面纱（piercing the corporate veil）是例外性制度。我国《公司法》第23条规定，股东滥用公司法人独立地位和股东有限责任，逃避债务，严重损害公司债权人利益的，应对公司债务承担连带责任；股东利用其控制的两个以上公司实施相关滥用行为的，可能发生横向人格否认；一人公司股东不能证明公司财产独立于自己财产的，依法承担连带责任。","课程内容以 Salomon 案说明公司独立人格的经典地位，以 Milwaukee 等案例讨论人格否认。案例学习要关注控制、财产混同、业务混同、资本显著不足、逃避债务及因果关系，不能仅因股东控制公司就否认公司人格。","易错：人格否认不是公司法人资格被永久取消，而是针对特定滥用行为和特定债务关系的责任穿透。"],["公司类型、设立与资本制度","我国公司法上的公司类型主要为有限责任公司与股份有限公司。有限责任公司强调股东人数、股权结构与人合性；股份有限公司以股份为资本单位，具有较强资合性和股份流通特征。公司设立涉及发起人、公司章程、出资/认股、组织机构和登记等要素。","现行《公司法》（2023年修订，2024年7月1日起施行）第47条规定，有限责任公司全体股东认缴出资原则上应自公司成立之日起五年内缴足，法律、行政法规或国务院决定另有规定的除外。第48条允许货币以及可估价、可依法转让的非货币财产出资；第49条规定按期足额缴纳义务。董事会负有核查和催缴出资职责，符合条件时可依法适用失权制度。","课程内容中“募集设立发起人认购35%”“货币出资30%”等比例属于旧法/旧教材口径，不能作为现行一般规则直接记忆。股份有限公司发起设立、募集设立及出资缴纳，应依现行公司法和注册资本登记管理规定分别核对。","考点：出资期限、非货币出资的可估价和可转让性、催缴、失权、股东出资加速到期、设立时出资瑕疵责任。"],["公司治理：股东会、董事会、监事会与董事义务","公司治理的核心是权力配置与监督制衡。股东会依法行使重大事项决策权；董事会负责经营决策和执行股东会决议；经理层负责日常经营管理；监事会或依法设置的审计委员会履行监督职能。新公司法允许公司依法律规定和章程选择适当组织结构，不能机械套用旧课件的单一“三会”图式。","董事、监事、高级管理人员对公司负有忠实义务和勤勉义务。忠实义务要求避免利益冲突、不得侵占公司财产、不得利用职务谋取不正当利益；勤勉义务要求为公司最大利益尽到管理者通常应有的合理注意。违反义务可能承担赔偿责任。","董事会、股东会决议瑕疵需要区分决议不成立、无效和可撤销；还应关注召集程序、表决方式、章程规定及善意相对人保护。","易错：股东会不是公司日常经营管理机关；董事对公司承担义务，不等同于对每一股东承担同等的直接信义义务。"],["公司变更、合并分立、解散清算与公司债","公司合并分为吸收合并与新设合并；分立涉及派生分立与新设分立。合并、分立、减资等事项需履行决议、通知债权人、公告、债务清偿或担保等程序。公司解散原因包括章程约定、股东会决议、合并分立、依法吊销/责令关闭/撤销、司法解散等；清算阶段应依法通知债权人、清理财产债权债务并编制清算报告。","公司僵局司法解散是救济最后手段。审查重点包括经营管理是否发生严重困难、继续存续是否使股东利益遭受重大损失、是否通过其他途径不能解决。公司债是公司依法发行的债务融资工具，持有人与公司之间形成债权债务关系，不因持有公司债而成为股东。","课程内容涉及股份、股票、公司债及资本结构选择，复习时应区分股权融资与债权融资：股东通常分享剩余收益并承担投资风险；债权人依约请求本金和利息，原则上不参与公司经营决策。","资料更新提示：公司法2023年修订后，登记资本、组织机构、董监高义务、股东权利及清算责任均有调整。"],["合伙企业：设立、内部关系与对外责任","《合伙企业法》规定普通合伙企业与有限合伙企业。普通合伙人对合伙企业债务承担无限连带责任；有限合伙企业由普通合伙人与有限合伙人组成，普通合伙人承担无限连带责任，有限合伙人以认缴出资额为限承担责任。合伙协议是合伙关系的基础，应由全体合伙人协商一致并书面订立。","合伙人内部关系包括出资、利润分配、亏损分担、事务执行、知情权、竞业限制、关联交易、忠实与诚信义务。对外关系中，普通合伙人执行合伙事务可产生对外代表效果；合伙协议对执行权限的内部限制，通常不能对抗善意第三人。","入伙通常需按合伙协议或法律规定取得同意并订立书面协议；新合伙人对入伙前合伙企业债务的责任依《合伙企业法》具体规定判断。退伙应区分协议退伙、通知退伙、当然退伙和除名退伙，并处理财产结算与责任承担。","易错：有限合伙人原则上不执行合伙事务、不对外代表有限合伙企业；但其实施法律允许的行为不当然构成执行合伙事务。"]],"law":"《中华人民共和国公司法》（2023修订，2024-07-01施行，重点第3、23、47—54条及董事义务、组织机构、清算部分）；《国务院关于实施〈公司法〉注册资本登记管理制度的规定》；《中华人民共和国合伙企业法》（2006年修订，重点第2、4、18、26、38、39、44、77条等）。"},{"id":3,"title":"代理法","subtitle":"代理关系结构、代理权产生、无权代理、内部义务与国际商事代理","lessons":[["代理的概念、结构与法律效果","代理（agency）是代理人（agent）依被代理人/本人（principal）的授权或法律规定，代表本人同第三人订立合同或实施其他法律行为，法律效果依法归属于本人。分析代理关系时要识别三个主体：本人、代理人、第三人；并分别判断代理权来源、权限范围、代理人是否以本人名义行为，以及第三人是否知情。","大陆法系传统上区分委任关系（内部合同关系）与授权行为（对外代理权）；英美法系代理法更强调代理关系本身及代理人代表本人同第三人交易的法律效果。国际商事代理可作广义理解，既包括以本人名义交易，也包括在授权范围内以代理人自己名义交易的特殊结构。","代理行为与委托合同并非同一概念：委托合同是内部债权关系；代理权决定代理人能否使法律行为效果直接归属于本人。委托关系存在，不意味着代理权范围无限。","考点：代理权、内部委任、代理行为、本人责任和代理人责任必须分层分析。"],["大陆法代理权：意定代理与法定代理","意定代理（voluntary agency）基于本人的授权产生。授权意思表示可以向代理人作出，也可能向第三人作出；书面授权通常应明确代理人、代理事项、权限与期限。法定代理（statutory agency）直接来源于法律规定，常用于保护未成年人、无民事行为能力人或其他需要法律代表的人。","我国《民法典》第161—163条确认民事主体可通过代理人实施民事法律行为，代理分为委托代理和法定代理；第165条规定书面授权委托书的记载事项。第162条的基本效果是：代理人在代理权限内以被代理人名义实施的民事法律行为，对被代理人发生效力。","实际操作中，授权文件应明确交易类型、标的、金额上限、期限、是否允许转委托、是否可以签署仲裁条款或担保文件。超越授权范围的交易要进一步判断追认、表见代理或相对人善意等问题。","易错：内部委任合同的范围与对外授权范围可能不完全一致；对外效果需看授权表示及第三人可合理知悉的权限外观。"],["英美法实际授权：明示与默示","实际授权（actual authority）是本人授予代理人的真实权限。明示授权通过口头或书面指示明确授予；默示授权（implied authority）则根据明示授权、代理职位、双方既往交易方式、履行授权事务所必需或通常附随的行为推断。","课件列举经理、秘书或职员因职位和通常业务而具有合理默示权限的案例。本人对代理人的内部限制若未向第三人披露，可能不能阻却善意第三人基于合理权限外观形成的主张；但具体结果仍取决于职位、行业惯例、交易性质和第三人是否知情。","例：公司长期让采购经理对外签订常规采购合同，即使公司内部将单笔采购额度设为较低上限，第三人并不知情且交易属于经理职位通常权限时，可能产生本人受约束的争议。","考点：实际授权关注本人真实意思；表见授权关注本人造成的外观及第三人合理信赖。"],["表见授权与表见代理","英美法表见授权（apparent authority / agency by estoppel）强调本人通过言行或疏忽造成代理权外观，使第三人有理由相信行为人有权代理，并基于该外观采取行动。其关键不是行为人自称有权，而是本人是否作出或容忍足以形成合理信赖的表示。","我国《民法典》第172条规定，无代理权、超越代理权或代理权终止后仍实施代理行为，相对人有理由相信行为人有代理权的，代理行为有效。分析时应查明：是否存在代理权外观；外观是否可归因于本人；相对人是否善意且有合理理由相信；交易是否处于外观权限范围。","例：公司向客户长期发出由某职员负责签约的通知，并允许其使用公司印章和合同模板；职员离职后仍以公司名义签约，须结合公司是否及时撤回外观、客户是否知道离职等事实判断。","易错：行为人自己制作名片、擅自使用公司抬头，通常不足以单独建立表见代理；必须考察本人一侧的可归责外观。"],["客观必须代理与追认代理","客观必须代理（agency of necessity）发生于代理人受托照管或运输他人财产，在紧急情况下为保全财产必须采取措施。课件归纳三个条件：行为在实际上或商业上确属必要；代理人采取措施前无法联系本人取得明示授权；措施善意且考虑相关当事人利益。","课件“斯佩内葛诉威斯特铁路公司案”（1921）中，铁路公司运送西红柿途中遇罢工，货物可能腐烂而就地出售。法院认为当时仍可通知货主却未通知，不满足无法联系本人的条件，因此不能以客观必须代理免责。","追认（ratification）是无权代理人以本人名义行为后，本人事后批准，使行为在符合条件时对本人发生效力。课件列出：行为时须表明代表本人；本人须可确定且在行为时具有法律人格；本人应知悉主要事实；追认应针对整个交易并在合理时间内作出等要件。","易错：紧急、方便或经济上有利，不等于当然满足客观必须代理；追认也不能任意把行为效果归属于行为时尚不存在的主体。"],["无权代理、代理终止与代理人义务","无权代理包括没有代理权、超越代理权和代理权终止后仍实施代理行为。我国《民法典》第171条规定，未经追认的无权代理行为原则上对本人不发生效力；相对人可以催告本人在收到通知之日起30日内追认，未表示视为拒绝；善意相对人在追认前可撤销。未获追认时，善意相对人可依法请求行为人履行债务或赔偿，但赔偿范围受法定限制。","代理终止事由包括代理期限届满、事务完成、本人取消委托、代理人辞任、代理人或本人死亡/丧失行为能力或法人终止等，须注意《民法典》第173—175条的例外。代理人应依诚信履行报告、保密、亲自处理或依法转委托、移交财产等义务；第164条规定代理人不履职造成损害的责任及恶意串通的连带责任。","国际商事代理还涉及显名代理、隐名代理、未披露本人代理。我国《民法典》第925、926条对受托人以自己名义订约、第三人知情或不知情时的直接约束与披露机制作了规定。","考点：把无权代理的效力、表见代理的效力、追认的效力和代理人对第三人的责任分别论证。"]],"law":"《民法典》第161—175条（代理）；第919条以下（委托合同）；第925—926条（受托人以自己名义订约及披露）。课件中的普通法判例用于比较法学习，适用时应查原判例与司法辖区。"},{"id":4,"title":"国际商事合同法","subtitle":"合同成立、效力、履行、违约救济、免责与合同消灭","lessons":[["合同概念、法律特征与合同分类","课程内容比较大陆法的合意理论、英美法的允诺理论与我国《民法典》的协议表述。合同通常具有主体平等、意思表示一致、设立变更终止民事权利义务关系等特征。合同分类包括双务/单务、有偿/无偿、诺成/实践、要式/不要式、主/从合同、有名/无名合同等。","分类的意义在于确定履行顺序、风险分配、成立要件、抗辩和救济。双务合同中双方互负对待给付；有偿合同通常存在对价交换；实践合同除合意外还要求交付标的物或完成法定事实；要式合同须满足法律规定的形式。","我国《民法典》第464条规定合同是民事主体之间设立、变更、终止民事法律关系的协议；第469条承认书面、口头和其他形式，电子数据交换、电子邮件等能够有形表现内容并可随时调取的数据电文视为书面形式。","易错：合同成立与合同生效不是同一问题；合同形式不等于合同效力的全部判断。"],["要约、要约邀请与要约的撤回撤销","要约（offer）是希望与他人订立合同的意思表示，内容应具体确定，并表明经受要约人承诺，要约人即受该意思表示约束。要约邀请（invitation to treat）只是希望他人向自己发出要约，如一般商业广告、价目表、招标公告等，但具体情形须依内容和交易背景判断。","撤回发生在要约到达受要约人之前或同时，阻止要约生效；撤销则发生在要约生效后、承诺前，消灭要约约束力。CISG第15、16条对要约撤回撤销作专门规定：不可撤销的要约、受要约人有理由信赖要约不可撤销并已据此行动等情形，限制撤销。","我国《民法典》第472条界定要约；第473条列举要约邀请；第475—477条涉及要约撤回、撤销及不得撤销情形。要约人确定了承诺期限或以其他方式明示不可撤销，或受要约人有理由认为不可撤销并已为履行作准备的，不得任意撤销。","考点：先判断是不是要约，再分析到达、生效、撤回、撤销和消灭。"],["承诺、镜像规则与合同成立时间","承诺（acceptance）是受要约人同意要约的意思表示。普通法镜像规则要求承诺与要约实质一致；CISG第19条规定，对要约内容作实质性添加、限制或修改通常构成拒绝并形成反要约；非实质性变更在特定条件下可构成承诺，除非要约人及时反对。","承诺的生效时间影响合同成立时间。大陆法和CISG通常采用到达主义；英美法传统投邮规则（mailbox rule）在特定通信方式和条件下可能使承诺于正确投邮时生效。不能把投邮规则泛化到即时通信或所有国际交易。迟到承诺是否有效，须区分迟延原因、要约人是否及时通知以及CISG第21条的规则。","我国《民法典》第479—489条规定承诺及生效规则；第484条原则上以通知到达要约人时生效，但根据交易习惯或要约要求以行为作出承诺的，依相应规则判断。","易错：沉默原则上不构成承诺；但交易习惯、当事人约定或法律规定可能产生不同结果。"],["对价与约因：英美法与大陆法比较","对价（consideration）是英美法合同法中支持允诺可执行性的传统要素，常要求允诺与某种法律上可识别的交换相联系。课件重点讨论对价的充分性与法律上的价值、过去对价、既存义务、部分清偿债务及允诺禁反言等问题。","法国法传统中的约因（cause）曾用于解释债务承担的目的与合同效力；2016年法国债法改革后，旧约因概念已不再作为合同有效成立的独立一般要件，改由内容合法、确定、真实同意等规则承担相关功能。德国法和我国法不采用英美法意义上的对价作为一般合同成立要件。","比较法答题应写明制度所属法系、功能和例外，不应把“无对价合同一律无效”作为跨法域通则。我国合同是否成立生效，主要依意思表示、主体能力、内容合法及特别形式规定判断。","考点：对价五要件和经典判例属于英美法课程内容；引用判例时要区分判决规则与教材总结。"],["合同效力：能力、真实合意、合法内容与形式","合同成立后仍需判断效力。课程内容归纳四要件：当事人具有相应民事行为能力；意思表示真实；合同内容合法且不违反公序良俗；符合法律要求的形式。合意瑕疵包括错误、欺诈、胁迫、不当影响和显失公平等，不同法域的构成要件和撤销后果不同。","我国《民法典》以民事行为能力、意思表示真实性、强制性规定与公序良俗、代理权限和合同形式等规则判断民事法律行为效力。第502条规定依法成立的合同原则上自成立时生效，但法律另有规定或当事人另有约定除外。第506条规定造成对方人身损害，或因故意/重大过失造成对方财产损失的免责条款无效。","CISG第11条原则上不要求国际货物买卖合同采用书面形式；但第12条、第96条涉及书面形式保留。中国曾作出相关声明，2013年撤回书面形式保留；中国仍有CISG第95条声明，涉及第1条第1款(b)项的适用路径，具体争议应核对公约缔约国状态表。","易错：CISG不调整合同效力的一般问题（第4条），不能用CISG直接解决欺诈、无效、所有权转移等所有问题。"],["合同履行、诚信义务与违约形态","合同履行要求当事人依约全面履行，并遵循诚信原则履行通知、协助、保密等附随义务。课件比较大陆法的给付不能、迟延、积极侵害债权，与英美法的条件条款、担保条款、中间条款以及重大/轻微违约。","我国《民法典》第509条规定全面履行与诚信附随义务；第577条规定不履行或履行不符合约定的违约责任；第584条规定损害赔偿范围并受可预见性规则限制。违约责任通常不以证明违约方主观过错为唯一前提，但免责事由、归责规则和损失范围仍须具体分析。","预期违约是履行期限届满前明确表示或以行为表明不履行主要债务；不安抗辩权则是双务合同中先履行一方在有确切证据证明对方履约能力严重恶化等法定情形下中止履行。我国《民法典》第527、528条规定不安抗辩权及通知、恢复履行或解除等后续机制。","易错：预期违约与不安抗辩权并不完全相同；中止履行不是当然解除合同，通常需要通知并审查对方是否提供适当担保。"],["违约救济：实际履行、损害赔偿、解除、禁令与违约金","实际履行要求违约方继续完成约定义务，英美法传统上把损害赔偿视为主要救济，实际履行通常具有衡平救济色彩；大陆法系更强调债权人请求履行的权利。损害赔偿关注履行利益、因果关系、可预见性、减损义务与证明。","我国《民法典》第580条规定非金钱债务实际履行请求及例外；第584条规定违约损失赔偿；第585条允许约定违约金并可依法请求调整；第563条规定法定解除事由。解除后还需处理返还、恢复原状、损害赔偿及结算清理条款效力。","CISG第45—52条规定买方救济，第61—65条规定卖方救济；第74—77条规定损害赔偿、可预见性、替代交易/时价差额与减损义务。损害赔偿可以与其他不冲突的救济并用。","易错：违约金并非当然全部有效或无效；需考虑约定、损失、调整规则与适用法律。"],["情势变更、合同落空、不可抗力与合同消灭","情势变更（大陆法传统）处理合同基础条件发生非通常变化、继续履行显失公平的情形；合同落空（frustration）是英美法下合同义务因非当事人风险范围内的根本事件而变得不可能、违法或与原合同性质根本不同；不可抗力是合同条款或法律规定的免责/调整事由。三者构成与效果不可混用。","我国《民法典》第533条规定合同基础条件发生订约时无法预见、不属于商业风险的重大变化，继续履行对一方明显不公平的，当事人可重新协商；在合理期限内协商不成，可请求法院或仲裁机构变更或解除。第590条规定不可抗力的通知、证明与按影响部分或全部免责，并要求及时通知和减轻损失。","合同终止/消灭包括履行、抵销、提存、免除、混同、解除及法律规定或约定的其他情形。《民法典》第557条规定债权债务终止事由；第562、563条规定约定解除与法定解除。","考点：判断事件是否属于商业风险；是否达到合同基础条件重大变化；是否使合同目的不能实现；是否及时通知、证明和采取减损措施。"]],"law":"《民法典》第137、142、143、153、157、472—489、502、509、527—533、557、562—563、577、580、584—590条；CISG第11—24、25、30—52、53—65、66—80条。"},{"id":5,"title":"国际货物买卖法","subtitle":"CISG适用、贸易术语、买卖双方义务、风险转移与救济","lessons":[["国际货物买卖合同与法律渊源","国际货物买卖合同通常指营业地处于不同国家的当事人之间订立的货物买卖合同。其特点是跨境履行、运输距离长、货物检验与交付分离、单据交易重要、付款与信用风险突出。法律渊源包括当事人选择的国内法、CISG、国际贸易惯例和合同条款。","CISG适用须先审查第1条的国际性与适用路径。第1条第1款(a)项适用于双方营业地位于不同缔约国；第1条第1款(b)项涉及国际私法规则指向缔约国法律，但须注意相关国家是否作出第95条声明。中国对第95条作有声明，因此不能不加分析地以第1条第1款(b)项适用CISG。","CISG排除消费者购买、拍卖、执行令状买卖、股票/证券/票据/货币、船舶/飞机、电力等交易，并依第3条处理加工承揽与服务占主导合同。第4条原则上不调整合同效力及货物所有权转移；第6条允许当事人排除公约或减损其规定。","易错：CISG不等于一切国际贸易合同法；须逐项确认适用范围、保留、排除与合同选择。"],["Incoterms® 2020：功能、结构与11种术语","Incoterms® 2020由国际商会发布，共11种术语，分为适用于任何运输方式的七种（EXW、FCA、CPT、CIP、DAP、DPU、DDP）和海运/内河运输四种（FAS、FOB、CFR、CIF）。规则主要分配卖方与买方的交货义务、风险转移、费用承担、运输安排、保险及进出口手续。","Incoterms并不决定合同是否成立、货物所有权何时转移、价款支付方式、违约救济或争议解决；也不替代完整买卖合同。写法应明确术语、精确指定地点/港口和版本，例如“CIF Shanghai Port, Incoterms® 2020”。","C组术语（CFR、CIF、CPT、CIP）常考“费用终点与风险转移点分离”：卖方支付主运输费用至指定目的地，但风险在装运港装船或交第一承运人时转移。D组术语中，DAP卖方将货物运至指定目的地、置于买方处置但不负责卸货；DPU卖方还须完成卸货。","易错：CIF并不意味着卖方承担货物到目的港前的全部风险；卖方虽支付运费和保险费，风险通常在装运港装船时转移。"],["FOB、CFR、CIF与FCA、CPT、CIP比较","FOB、CFR、CIF适用于海运或内河运输。三者通常在货物装上船时完成交货并转移风险；FOB由买方安排主运输，CFR由卖方支付运费，CIF由卖方支付运费并办理最低约定保险。","FCA、CPT、CIP适用于任何运输方式，风险通常在卖方将货物交给第一承运人时转移。FCA由买方安排主运输；CPT由卖方支付运费；CIP由卖方支付运费并按规则投保较高保险保障。Incoterms® 2020对CIP默认保险保障通常高于CIF；具体险别仍可由合同另行约定。","FCA 2020允许双方约定买方指示承运人在货物装船后向卖方签发已装船提单，以便卖方在信用证交易中提交单据。此安排不改变FCA下交货与风险转移的基本地点。","考试技巧：先识别运输方式，再识别交货地点，最后分开写“风险何时转移”“谁付主运费”“谁投保”“谁办理进出口手续”。"],["卖方义务：交货、交单、运输通知、品质与权利担保","CISG第30条规定卖方应交付货物、移交有关单据并转移货物所有权（所有权转移本身依适用国内法判断）。第31—33条涉及交货地点与时间；第32条涉及货物特定化、安排运输及必要通知。","第34条要求卖方按约定时间、地点和方式移交单据，并允许在提前交单时于期限届满前纠正不符，但不得给买方造成不合理不便或费用。第35条要求货物在数量、质量、规格、包装方面符合合同，并规定通常用途、特定用途、样品/模型与包装等默示符合标准。第36条规定风险转移时已存在的不符，即使之后才显现，卖方仍可能负责。","权利担保方面，第41条要求货物不受第三人权利或请求影响；第42条处理工业产权和知识产权请求，并设有卖方知情、买方营业地或预定转售国法律等限制。","易错：货物质量不符与第三人权利瑕疵是不同的违约类型；卖方知识产权担保不是对全球任何法域所有权利请求无条件负责。"],["买方义务、检验与不符通知","CISG第53条规定买方支付价款并收取货物。第54—59条涉及付款义务、价格确定、付款地点和时间；第60条界定收取货物的义务，包括采取合理行动使卖方能够交货及实际接收。","第38条要求买方在按情况实际可行的最短时间内检验货物；涉及运输时可推迟至货物到达目的地。第39条要求买方在发现或理应发现不符后的一段合理时间内通知卖方，并说明不符性质；原则上最迟不得超过实际交付后两年，除非该期限与合同保证期限不符。","买方还负有合理保全货物的义务。若打算拒收或退货，应依第86条以下规则采取合理措施保全货物；必要时可寄存、转售或采取其他措施，并依规定处理费用。","易错：检验义务与通知义务不是同一时间节点；及时检验后仍需及时、具体地通知卖方。"],["根本违约与买卖双方救济","CISG第25条的根本违约标准，关注违约是否实质剥夺对方根据合同有权期待取得的利益，同时考虑违约方是否预见或理应预见该结果。课件用圣诞节火鸡与普通肉鸡迟延交货对比说明：季节性用途可能使交货时间成为合同目的核心。","买方救济包括要求履行（第46条）、交付替代货物（须根本违约）、修理（第46条第3款）、给予额外履行期（第47条）、接受卖方补救（第48条）、宣告合同无效/解除（第49条）、减价（第50条）和损害赔偿。卖方救济包括要求付款和收货（第62条）、给予额外时间（第63条）、解除合同（第64条）、确定规格（第65条）和损害赔偿。","损害赔偿依第74条以包括利润在内的损失为基础并受订约时可预见性限制；第75、76条分别处理替代交易差额和时价差额；第77条要求受损方采取合理措施减轻损失。","易错：不是任何违约都能解除合同；要区分根本违约与一般违约、部分交货与整个合同、合理额外时间与立即解除。"],["货物所有权与风险转移","CISG不调整货物所有权转移对合同的影响（第4条），但第66—70条专门调整风险转移。风险转移决定货物偶然灭失或损坏由谁承担价款风险，不等同于所有权转移。","涉及运输的合同，第67条原则上在货物交给第一承运人时转移风险；若卖方有义务在某一特定地点交给承运人，则风险在该地点交付前不转移。无论如何，在货物清楚特定化于合同之前，风险不转移。运输途中销售的货物依第68条处理；其他情形适用第69条。第70条明确，卖方根本违约时，风险转移规则不损害买方可采取的救济。","我国《民法典》第604—611条另有买卖风险规则：一般以交付为节点；运输买卖和在途货物有特别规定；买方原因导致未按期交付、标的物质量问题致合同目的不能实现等情形会影响风险承担。","易错：风险转移不等于卖方不再承担任何责任；风险转移后，卖方仍可能因交货质量不符、权利瑕疵或其他违约承担责任。"]],"law":"CISG第1—6、11—24、25、30—52、53—65、66—80条；《民法典》第604—611条；Incoterms® 2020官方规则及ICC说明。中国对CISG第95条作有声明；中国2013年撤回第96条书面形式保留，引用时应核对联合国条约状态。"},{"id":6,"title":"国际货物运输法","subtitle":"海上运输方式、提单、承运人责任、租船合同与电子运输单证","lessons":[["班轮运输与租船运输","班轮运输（liner service）按固定航线、固定船期和固定港口组织运输，适合货流稳定、品种多、批量较小的杂货。租船运输（charter/tramp service）无固定船期和航线，依租船合同安排船舶与货物运输。","航次租船由出租人提供全部或部分舱位完成一个或数个航次，承租人支付运费；定期租船在约定期间提供船舶，出租人通常负责配员和船舶管理，承租人负责商业营运调度并支付租金；光船租赁不配备船员，承租人取得占有、使用和营运控制。","租船合同常涉及船舶规范、货物、装卸港、装卸时间、滞期费、速遣费、运费、留置权和责任终止条款。应结合合同条款判断谁控制航行、谁负担燃料和船员费用、装卸时间如何计算。","易错：航次租船与海上货物运输合同的法律结构不完全相同；不能把三种租船的费用、控制权和责任分配混为一谈。"],["提单的定义、三项功能与证据效力","提单（Bill of Lading, B/L）是承运人接收货物或货物装船后签发的运输单证，用以证明海上货物运输合同和货物接收/装船，并保证据以交付货物。课件强调三项功能：运输合同的证明、货物收据、物权凭证。","运输合同通常在订舱/托运被承运人接受时成立，提单常在货物装船后签发，主要是合同证明而非必然构成合同本身。提单记载货物品名、件数、重量、装卸港、托运人、收货人、签发日期等。提单转让给善意第三人后，其证据效力可能受到特别保护。","现行《海商法》（2025年修订，2026年5月1日起施行）第73—80条专门规范提单签发、内容、批注、证据效力及转让。第78条规定提单对承运人接收货物/装船及表面状况的证据效力；第80条区分记名提单、指示提单与不记名提单的转让方式。","易错：提单具有物权凭证性质，但不能据此推断提单本身就是所有权转移的唯一法律原因；货物所有权仍需结合适用法律和交易安排判断。"],["提单分类与倒签、预借提单","提单可按是否装船分已装船提单与收货待运提单；按收货人抬头分记名、不记名和指示提单；按批注分清洁与不清洁提单；按运输方式分直达、海上联运和多式联运单证。","倒签提单是货物实际装船日晚于约定期限，却将提单日期倒填为较早日期；预借提单是在货物尚未装船或尚未装完时提前签发已装船提单。两者可能造成对买方、银行或善意第三人的虚假陈述，存在欺诈、违约及承运人责任风险。保函不能当然使欺诈性提单合法化。","清洁提单仅表示未对货物表面状况作不良批注，不代表承运人保证货物内在品质完全无瑕疵。若承运人知道货物外表有明显缺陷，应依法作出适当批注。","考点：区分清洁提单与货物质量担保；区分倒签、预借；分析保函仅在承运人与托运人之间可能产生的内部效力，不能当然对抗善意第三人。"],["海牙规则、维斯比规则与汉堡规则比较","课件介绍三套国际统一规则。海牙规则（1924）确立承运人最低义务框架，包括开航前和开航时谨慎处理使船舶适航、适当谨慎装载搬移积载运输保管照料卸载货物，并规定若干免责事由。传统海牙规则的货物责任期间通常概括为“钩至钩”。","维斯比规则对海牙规则作修订，涉及适用范围、集装箱货物赔偿单位、提单对善意第三人的证据效力、承运人及受雇人责任限制和诉讼时效等。汉堡规则（1978）采取不同责任框架，责任期间扩展至承运人掌管货物期间，调整承运人责任、迟延交付、保函、管辖与时效。","联合国贸法会资料显示，汉堡规则于1992年11月1日生效。三套公约的缔约国范围不同，具体争议适用哪一套规则，必须结合合同条款、运输单证、装卸港、适用法和强制性规定分析。","易错：不能简单说“所有国际海运都适用海牙规则”。中国现行海商法的强制性规定和合同选择必须优先核对。"],["我国现行海商法：2025年修订、2026年施行的重点更新","截至2026年11月，适用现行《海商法》时应使用2025年10月28日修订、2026年5月1日起施行的文本，而不是仅沿用旧课件引用的1992年版本。新法第四章专门规定海上货物运输合同，包括承运人责任、托运人责任、运输单证、电子运输记录、货物交付和多式联运。","第47条区分集装箱货物与非集装箱货物责任期间：集装箱货物原则上自装货港接收至卸货港交付、处于承运人掌管期间；非集装箱货物原则上自装船至卸船。第48条规定开航前和开航当时谨慎处理使船舶适航；第49条规定妥善谨慎接收、装载、搬移、积载、运输、保管、照料、卸载和交付。第50条规范航线与合理绕航。","新法第82—86条确立电子运输记录制度，符合条件的电子运输记录与运输单证具有同等效力，不得仅因采用电子形式而否定其法律效力；可转让电子记录须保障单一性、完整性和持有人排他控制。第88条规定货损通知：非集装箱货物通常交付次日起连续7日内，集装箱货物15日内通知；迟延交付损失另有60日书面通知规则。","特别提示：旧课件中关于我国未参加海牙/维斯比/汉堡公约、我国海商法以旧规则为基础的表述，需结合2026年新海商法重新核对；不能将旧法的责任期间、时效和赔偿限额直接作为现行中国法结论。"],["承运人责任、托运人义务与租船合同","承运人责任分析应先确定责任期间，再判断货物灭失、损坏或迟延交付是否发生于该期间，最后判断法定免责、举证责任和赔偿限额。新海商法第52条列出船舶驾驶/管理过失、船上火灾、天灾、海上危险、战争、政府行为、罢工、救助、托运人行为、货物固有缺陷、包装不当和潜在缺陷等免责事项，并区分国内海上运输与国际运输。","托运人应按合同交货并保证货物适运；妥善包装、保证货物品名/标志/件数/重量等资料正确；办理运输手续；危险货物应正确包装、标志并书面告知危险性质和防范措施。危险货物申报不实可能导致卸货、销毁和赔偿责任。","新法第61—66条处理承运人与实际承运人关系、连带责任与相互追偿；租船合同章节则继续区分航次、定期与光船租赁。","考点：责任期间—损失事实—免责事由—举证责任—限责—时效，按此顺序答题。"]],"law":"《中华人民共和国海商法》（2025年修订，2026-05-01施行）重点第44—95条；最高人民法院《关于适用〈中华人民共和国海商法〉时间效力的若干规定》（法释〔2026〕8号）；《汉堡规则》（UNCITRAL）。"},{"id":7,"title":"海上保险法","subtitle":"保险合同结构、承保风险、海损类型、险别与新海商法规则","lessons":[["海上保险合同的概念与主体","海上货物运输保险是货物利益相关人按照约定险别投保、支付保险费，保险人在约定承保范围内对海上保险事故造成的损失承担赔偿责任的制度。保险人承担风险并支付保险金；投保人提出投保要求并订立合同；被保险人对保险标的具有保险利益并享有保险金请求权。投保人与被保险人可以是同一人，也可能不同。","保险合同基本要素包括保险标的、保险风险、保险事故、保险价值、保险金额、保险费、保险期间、保险责任与除外责任。保险风险是尚未发生的可能造成损失的危险；保险事故是约定风险实际发生并落入承保范围的事件。","现行《海商法》（2025年修订，2026年5月1日起施行）第13章第240条定义海上保险合同；第241条列明合同内容；第242条将船舶、货物、船舶营运收入、货物预期利润、船员工资、第三人责任等纳入可保险标的。较旧课件只聚焦货物保险，现行法的保险标的范围更广。","易错：保险责任不是对一切损失负责，而是以约定承保风险、保险期间、保险金额和除外责任为边界。"],["海上风险与外来风险分类","课件将风险分为海上风险与外来风险。海上风险包括自然灾害和意外事故；外来风险包括一般外来风险、特别外来风险和特殊外来风险。自然灾害是自然界力量引起的灾害；意外事故是偶然、非预期的事故。","一般外来风险示例包括偷窃、串味、雨淋、钩损、受潮受热、锈损等；特别外来风险涉及政治、行政因素；特殊外来风险包括战争、罢工等。风险归类要看致损原因，而不能仅看损失表象。","课件特别提示：强热带风暴或海上恶劣天气导致雨淋湿损，归因于自然灾害；普通雨淋属于一般外来风险。装卸中整件货物落海属于意外事故；装卸钩损通常属于一般外来风险。","考点：先找直接致损原因，再判断风险类别，最后核对具体险别是否承保及是否有除外责任。"],["全部损失：实际全损与推定全损","全部损失指保险标的全部毁坏或丧失原有用途。实际全损包括保险标的灭失、严重毁坏而完全失去原有形体或效用、被保险人永久丧失占有等典型情况。课件例子包括船舶沉没、货物全部焚毁、茶叶串味不能食用、食糖溶化无法使用或货物被没收。","推定全损是保险标的尚未实际全部灭失，但合理判断其修复、恢复、救助或继续运至目的地的费用达到或超过其保险价值/约定价值，或被保险人因此合理放弃标的等情形。推定全损与实际全损不同，通常涉及委付（abandonment）及保险人是否接受委付。","新《海商法》第13章将“保险标的的损失和委付”单列为第五节，意味着不能只按旧课件的简化描述理解推定全损；需要结合新法关于委付通知、保险人接受、权利义务转移等具体条文。","易错：修理费“接近”价值并不当然自动构成推定全损，必须按适用法律和保险合同计算相关费用、价值和委付条件。"],["部分损失：共同海损与单独海损","共同海损（General Average）是同一海上航程中，船舶、货物和其他财产遭遇共同危险，为共同安全有意、合理采取措施所直接造成的特殊牺牲或特殊费用。课件归纳三个要件：共同危险、有意采取措施、措施合理。","单独海损（Particular Average）是由承保风险造成、但不属于共同海损的部分损失。货物单独遭受风暴湿损、受潮受热或装卸钩损等，通常属于单独海损。共同海损需要在受益财产之间依法分摊；单独海损通常由受损利益自身承担或由其保险人依承保范围赔偿。","案例：为使搁浅船舶脱浅而有意抛弃部分货物，若共同危险、措施有意且合理，可能构成共同海损；货物因自身腐烂、正常损耗或为解决自身问题发生的费用，通常不满足共同海损共同危险要件。","易错：不是所有“为船舶安全花的钱”都是共同海损；必须与同一航程中船货共同危险和有意合理牺牲/费用直接相关。"],["平安险、水渍险、一切险与附加险","课件以中国人民保险公司海洋运输货物保险条款为教学框架：平安险（FPA）强调“单独海损不赔”，但仍承保约定范围内的全部损失、共同海损以及特定意外事故造成的部分损失；水渍险（WA）在平安险基础上增加自然灾害造成的部分损失；一切险（All Risks）在水渍险基础上扩展至一般附加险承保风险。","一般附加险包括偷窃提货不着、淡水雨淋、短量、混杂玷污、渗漏、碰撞破碎、串味异味、受潮受热、钩损、包装破裂、锈损等。特别附加险可能包括交货不到、进口关税、舱面、拒收等；特殊附加险常见战争险、罢工险。具体保障须以保险条款版本和批单为准。","“一切险”并非对所有原因、所有间接损失无条件承保。课件列出的常见除外责任包括被保险人故意行为、迟延或市价变化、货物自然损耗/固有缺陷/自然特性、包装不当等；具体保险合同可能另有约定。","易错：险别名称不能替代保险条款；判断赔偿须按致损风险、损失性质、保险责任期间、除外责任和被保险人义务逐项分析。"],["保险利益、保险价值、保险金额与赔偿原则","保险利益是被保险人对保险标的具有的法律上承认的利益。保险价值是保险标的价值；保险金额是保险人承担赔偿责任的最高约定金额。保险金额低于保险价值可能构成不足额保险，保险金额超过保险价值的超额部分通常无效。","新《海商法》第243条规定保险价值可由双方书面约定；未约定时，货物保险价值按保险责任开始时货物起运地发票价格或实际价值加运费和保险费计算。第244条规定保险金额由双方约定且不得超过保险价值。第264条规定保险赔偿以保险金额为限；不足额保险部分损失原则上按保险金额与保险价值比例赔偿。","保险事故发生后，被保险人应及时通知保险人并采取必要合理措施防止或减少损失；保险人对合理施救、检验和估价费用有法定支付规则。故意造成损失、迟延、市价变化、自然损耗、货物固有缺陷和包装不当等可能构成除外责任。","考点：区分保险金额与保险价值；赔偿不应使被保险人因保险事故获得超过其保险利益的额外收益。"],["现行海上保险法律更新：新海商法第十三章","2025年修订《海商法》于2026年5月1日起施行，新增/系统编排“海上保险合同”专章。其内容包括一般规定、合同订立解除转让、被保险人义务、保险人责任、保险标的损失和委付、保险赔偿支付。","第247—249条涉及如实告知、违反告知义务的后果及格式条款提示说明；第255—259条涉及保险合同转让和预约保险；第260—262条规定支付保险费、保证条款、事故通知和减损义务；第263—270条涉及保险赔偿、费用、共同海损分摊和除外责任。","这意味着旧课件中仅以《保险法》一般规定和旧版海商法为背景的内容，应当补充新《海商法》第13章。海上保险属于特别法领域，先适用海商法特别规定，再视其规定与适用范围补充保险法一般规则。","易错：保险责任期间不必然从保险合同签订时开始；须查合同约定的起讫时间、运输条款及保险责任开始条款。"]],"law":"《中华人民共和国海商法》（2025年修订，2026-05-01施行）第240—270条；《中华人民共和国保险法》关于保险利益、如实告知、格式条款、保险赔偿等一般规则；具体险别以保险单及适用货物保险条款为准。"}],"refs":[{"label":"《中华人民共和国民法典》（最高人民法院公布文本）","url":"https://www.court.gov.cn/zixun/xiangqing/233181.html","chapters":[1,3,4,5]},{"label":"《中华人民共和国公司法》（2023修订，市场监管总局）","url":"https://www.samr.gov.cn/djzcj/zcfg/fl/art/2026/art_9b4263a169cf43c2aba950cfc9ac1af2.html","chapters":[2]},{"label":"《国务院关于实施〈公司法〉注册资本登记管理制度的规定》","url":"https://xzfg.moj.gov.cn/mobile/law/detail?LawID=1727","chapters":[2]},{"label":"《中华人民共和国合伙企业法》（市场监管总局）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/fgs/art/2023/art_28f19c7b1d204e69a131292d0b793078.html","chapters":[2]},{"label":"CISG 公约文本与适用说明（UNCITRAL）","url":"https://uncitral.un.org/en/texts/salegoods/conventions/sale_of_goods/cisg","chapters":[1,4,5]},{"label":"CISG 缔约国状态表（UNCITRAL）","url":"https://uncitral.un.org/en/texts/salegoods/conventions/sale_of_goods/cisg/status","chapters":[5]},{"label":"Incoterms® 2020 官方介绍（ICC）","url":"https://iccwbo.org/business-solutions/incoterms-rules/incoterms-2020/","chapters":[1,5]},{"label":"《中华人民共和国海商法》（2025修订，2026-05-01施行，商务部法规库）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=104015","chapters":[6,7]},{"label":"《汉堡规则》（UNCITRAL）","url":"https://uncitral.un.org/en/texts/transportgoods/conventions/hamburg_rules","chapters":[6]},{"label":"《中华人民共和国保险法》（市场监管总局）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_4c715a53f3d4402c89f62ae77809f638.html","chapters":[7]},{"label":"《海商法》时间效力司法解释（最高人民法院，2026）","url":"https://www.court.gov.cn/fabu/xiangqing/498581.html","chapters":[6,7]}],"quiz":[{"c":1,"type":"填空","q":"国际商法调整的商事关系主要包括商事组织关系和商事____关系。","a":"交易","why":"国际商法既涉及商事组织，也涉及跨境商事交易。"},{"c":1,"type":"填空","q":"国际商法的四大渊源包括国际条约、国际惯例、国内立法和国内____。","a":"判例","why":"课程提纲归纳的四大渊源。"},{"c":1,"type":"填空","q":"1980年《联合国国际货物销售合同公约》的英文简称是____。","a":"CISG","why":"CISG是国际货物销售合同领域的重要统一法公约。"},{"c":1,"type":"填空","q":"Incoterms®主要解释国际贸易术语中交货、风险、费用及双方____的分配。","a":"义务","why":"贸易术语并不直接解决合同所有问题，而是分配交货、风险、费用和义务。"},{"c":1,"type":"单选","q":"下列哪一项属于国际商会发布的国际贸易术语规则？","opts":["CISG","Incoterms® 2020","《民法典》","《联合国宪章》"],"a":1,"why":"Incoterms®由国际商会制定，用于解释贸易术语。"},{"c":1,"type":"单选","q":"关于国际商法中的“国际”，下列理解最准确的是？","opts":["仅指国家与国家之间的公法关系","主要指商事主体之间具有跨境因素的关系","只要合同使用外语即属国际关系","必须由两个国家政府共同参与"],"a":1,"why":"国际商法主要处理跨境私人商事关系，不等同于国家间国际公法关系。"},{"c":1,"type":"单选","q":"英美法系中，判决理由部分对裁判必要的法律规则通常称为？","opts":["Obiter dicta","Ratio decidendi","Equity","Stare decisis"],"a":1,"why":"Ratio decidendi是判决中对裁判结果具有必要性的法律理由。"},{"c":1,"type":"多选","q":"下列哪些属于课程所列国际商法的四大渊源？","opts":["国际条约","国际惯例","国内立法","国际组织新闻稿"],"a":[0,1,2],"why":"四大渊源为国际条约、国际惯例、国内立法和国内判例。"},{"c":1,"type":"多选","q":"关于大陆法系与英美法系的比较，下列哪些表述正确？","opts":["大陆法系重视法典编纂","英美法系判例在法律发展中具有重要地位","两大法系在现代完全没有相互借鉴","英美法系也存在大量成文法"],"a":[0,1,3],"why":"两大法系各有传统，但现代均吸收对方制度经验。"},{"c":1,"type":"多选","q":"判断国际商事惯例能否适用于具体合同，通常需要考察哪些因素？","opts":["当事人是否约定适用","双方是否形成相关交易习惯","相关公约是否规定适用","只要某做法常见就当然适用"],"a":[0,1,2],"why":"惯例并非因常见就自动适用，须结合约定、习惯及适用规则判断。"},{"c":2,"type":"填空","q":"公司具有独立法人资格，原则上以其全部____对公司债务承担责任。","a":"财产","why":"公司财产独立于股东个人财产，是公司独立责任的基础。"},{"c":2,"type":"填空","q":"有限责任公司股东认缴出资额原则上应自公司成立之日起____年内缴足。","a":"五","why":"现行《公司法》第47条确立一般五年缴足规则，法律、行政法规及国务院决定另有规定的除外。"},{"c":2,"type":"填空","q":"公司法人人格否认制度通常也称为揭开公司____。","a":"面纱","why":"该制度针对股东滥用公司独立人格和有限责任逃避债务等情形。"},{"c":2,"type":"填空","q":"合伙企业中，普通合伙人对合伙企业债务通常承担____责任。","a":"无限连带","why":"普通合伙人原则上承担无限连带责任，法律另有规定的特殊组织形态除外。"},{"c":2,"type":"单选","q":"现行《公司法》下，有限责任公司股东认缴出资的一般缴纳期限是？","opts":["自公司成立之日起五年内","自公司成立之日起十年内","公司解散时一次缴纳","法律没有一般期限要求"],"a":0,"why":"《公司法》第47条规定有限责任公司股东认缴出资原则上自公司成立之日起五年内缴足。"},{"c":2,"type":"单选","q":"下列哪种情形最可能触发公司法人人格否认？","opts":["公司依法独立经营并保存账簿","股东滥用公司法人独立地位逃避债务，严重损害债权人利益","公司正常进行利润分配","股东依法转让股权"],"a":1,"why":"人格否认针对股东滥用公司独立人格和有限责任、严重损害债权人利益的行为。"},{"c":2,"type":"单选","q":"普通合伙企业对外债务的基本责任规则是？","opts":["所有合伙人仅以出资额为限承担责任","普通合伙人承担无限连带责任","仅执行事务合伙人承担责任","由债权人自行选择公司股东承担"],"a":1,"why":"普通合伙人对合伙企业债务承担无限连带责任。"},{"c":2,"type":"多选","q":"下列哪些属于公司法人独立地位的通常表现？","opts":["公司拥有独立财产","公司以自身名义从事民事活动","公司以自身财产对外承担责任","股东与公司财产当然混同"],"a":[0,1,2],"why":"独立财产、独立名义和独立责任是公司法人格的重要表现。"},{"c":2,"type":"多选","q":"关于现行有限责任公司出资制度，下列哪些表述正确？","opts":["股东应按章程约定期限缴纳认缴出资","一般情况下认缴出资期限不得超过公司成立之日起五年","股东可以完全不履行出资义务","法律、行政法规或国务院决定另有规定的，可能适用特别规则"],"a":[0,1,3],"why":"现行法设一般五年期限，同时保留依法设定特别规则的空间。"},{"c":2,"type":"多选","q":"下列哪些事项通常属于合伙协议应当约定或明确的核心事项？","opts":["合伙目的和经营范围","合伙人的姓名或名称及住所","利润分配、亏损分担办法","任何合伙人均可擅自处分合伙企业全部财产"],"a":[0,1,2],"why":"合伙协议应明确合伙基本事项及内部权利义务安排。"},{"c":3,"type":"填空","q":"代理人以____名义在代理权限内实施行为，其法律效果原则上直接归属于____。","a":"被代理人","why":"代理行为在权限范围内产生的法律效果原则上由本人承受。"},{"c":3,"type":"填空","q":"英美代理法中的实际授权包括明示授权和____授权。","a":"默示","why":"实际授权可由明确表示产生，也可从关系、行为和必要权限中推知。"},{"c":3,"type":"填空","q":"被代理人以自己的言行使第三人合理相信代理权存在，可能构成____授权。","a":"表见","why":"表见授权保护基于本人表示而合理信赖的第三人。"},{"c":3,"type":"填空","q":"无权代理行为经被代理人事后承认，称为____。","a":"追认","why":"追认可使原本未经授权的代理行为在法律规定条件下对本人发生效力。"},{"c":3,"type":"单选","q":"大陆法系代理制度中，课程强调的“区别论”主要是区分哪两项制度？","opts":["委任与授权","所有权与占有","债权与物权","普通法与衡平法"],"a":0,"why":"大陆法系通常区分代理权授予与代理人内部委任关系。"},{"c":3,"type":"单选","q":"表见代理成立的核心基础通常是？","opts":["代理人单方声称自己有权","被代理人的行为造成可归责的权利外观，第三人合理信赖","第三人完全不需要审查任何事实","代理人事后承诺承担责任"],"a":1,"why":"表见代理重在本人造成的权利外观及第三人的合理信赖。"},{"c":3,"type":"单选","q":"关于客观必须代理，下列哪项不是课程列出的典型成立条件？","opts":["采取行动在事实上或商业上确有必要","行动前无法与本人取得联系","代理人善意并考虑相关利益","代理人可以借机获得额外利润"],"a":3,"why":"客观必须代理要求必要性、无法及时联系本人及善意合理行事。"},{"c":3,"type":"多选","q":"关于代理权的产生，下列哪些表述符合课程内容？","opts":["大陆法系存在意定代理","大陆法系存在法定代理","英美法系承认实际授权","表见授权必须存在本人明确书面授权"],"a":[0,1,2],"why":"意定、法定代理及实际授权均属于课程讲授的代理权来源或形态。"},{"c":3,"type":"多选","q":"代理人以本人名义订立合同后，关于追认的条件，下列哪些属于课程列举的要点？","opts":["代理人订约时须表明以本人名义行事","被追认的本人须可确定","法人本人通常须在代理人订约时已经取得法律人格","任何无关第三人均可代替本人追认"],"a":[0,1,2],"why":"追认须由适格本人作出，且订约时本人身份及法律人格应符合要求。"},{"c":3,"type":"多选","q":"关于代理关系内部义务，下列哪些通常属于代理人的基本义务？","opts":["遵守授权范围","忠实维护本人利益","避免利益冲突并披露重要信息","擅自将本人财产用于个人利益"],"a":[0,1,2],"why":"代理人负有依授权行事、忠实、谨慎及避免利益冲突等义务。"},{"c":4,"type":"填空","q":"要约是向特定人发出的、内容具体确定并表明经承诺即受约束的____表示。","a":"意思","why":"要约须具有订约意图并具备足够确定的内容。"},{"c":4,"type":"填空","q":"CISG第19条以承诺对要约作出实质性变更时，原则上构成对要约的____。","a":"反要约","why":"实质性变更通常构成拒绝原要约并提出反要约。"},{"c":4,"type":"填空","q":"英美合同法中的对价通常译为____。","a":"约因","why":"Consideration是英美法合同成立的重要制度要素之一。"},{"c":4,"type":"填空","q":"中国《民法典》第528条规定的不安抗辩权，适用于有确切证据证明对方可能丧失或可能____履行债务的情形。","a":"不能","why":"不安抗辩权针对先履行方有确切证据证明对方履行能力显著恶化等法定情形。"},{"c":4,"type":"单选","q":"下列哪项最能体现CISG第19条对承诺变更的规则？","opts":["任何变更都当然构成有效承诺","实质性变更原则上构成反要约","承诺人可以任意改变价格而合同仍成立","只有书面承诺才有效"],"a":1,"why":"对价、数量、质量、交货地点时间、责任范围或争议解决等实质变更，原则上构成反要约。"},{"c":4,"type":"单选","q":"关于要约撤回与撤销，下列哪项表述正确？","opts":["撤回发生在要约生效前或同时到达","撤销只能在合同成立后进行","CISG下所有要约均可随时撤销","撤回与撤销完全同义"],"a":0,"why":"撤回针对要约生效前；撤销针对要约生效后、承诺生效前，须符合相应规则。"},{"c":4,"type":"单选","q":"中国《民法典》第527条规定的不安抗辩权，通常由哪一方行使？","opts":["后履行债务一方","先履行债务一方","任何无关第三人","只能由法院依职权行使"],"a":1,"why":"先履行债务一方在法定条件下可中止履行。"},{"c":4,"type":"多选","q":"下列哪些通常属于合同有效或生效判断中需要考察的事项？","opts":["当事人具有相应民事行为能力","意思表示真实","内容不违反法律、行政法规的强制性规定且不违背公序良俗","合同必须一律经公证才生效"],"a":[0,1,2],"why":"合同效力需结合主体能力、真实意思和内容合法性等判断，形式要求依法律规定。"},{"c":4,"type":"多选","q":"下列哪些属于课程讲授的合同救济方式？","opts":["实际履行","损害赔偿","解除合同","禁令或违约金"],"a":[0,1,2,3],"why":"课程归纳的救济包括实际履行、损害赔偿、解除、禁令及违约金等，适用条件因法域而异。"},{"c":4,"type":"多选","q":"关于预期违约与不安抗辩权，下列哪些表述正确？","opts":["预期违约是英美法发展出的制度","不安抗辩权见于中国《民法典》第527、528条","二者均可能在履行期限届满前产生救济或中止履行效果","二者在构成要件和法律效果上完全相同"],"a":[0,1,2],"why":"两种制度功能有相似之处，但制度来源、构成条件和法律效果并不完全相同。"},{"c":5,"type":"填空","q":"CISG第6条体现当事人可以排除公约适用或减损其规定的____自治。","a":"意思","why":"CISG尊重当事人排除公约或变更其规定的自治。"},{"c":5,"type":"填空","q":"Incoterms® 2020中，CIF术语下卖方负责办理运输并投保最低限度的____保险。","a":"海运","why":"CIF要求卖方订立运输合同并取得约定保险，但风险在装运港装船时转移。"},{"c":5,"type":"填空","q":"FOB术语下，货物在装运港装上船时，风险通常由卖方转移给____。","a":"买方","why":"FOB以货物装上买方指定船舶作为风险转移节点。"},{"c":5,"type":"填空","q":"CISG第25条所称根本违约，要求违约造成对方实质上丧失其有权期待的____。","a":"合同利益","why":"根本违约的判断核心是对合同利益的实质剥夺，并结合可预见性等要件。"},{"c":5,"type":"单选","q":"在FOB Incoterms® 2020下，货物风险通常于何时转移？","opts":["货物抵达目的港时","货物在装运港装上买方指定船舶时","卖方签发商业发票时","买方支付全部价款时"],"a":1,"why":"FOB的交货与风险转移点是装运港装船。"},{"c":5,"type":"单选","q":"CISG第35条关于货物相符性，主要要求卖方交付的货物符合什么？","opts":["仅符合卖方所在国国内标准","合同约定的数量、质量、规格及适用性等要求","只要能够出口即可","买方目的国所有行业惯例一律适用"],"a":1,"why":"货物是否相符首先依合同约定，并结合公约规定判断。"},{"c":5,"type":"单选","q":"CIF术语下，风险转移的通常时点是？","opts":["目的港卸货完成","货物在装运港装上船","买方实际收到提单","买方完成转售"],"a":1,"why":"CIF属于装运合同，风险在装运港装船时转移，卖方仍须安排运费和保险。"},{"c":5,"type":"多选","q":"关于CISG适用，下列哪些分析因素需要考虑？","opts":["当事人营业地是否位于不同国家","相关国家是否为缔约国及适用路径","当事人是否有效排除或变更公约","只要货物跨境运输就必然适用公约"],"a":[0,1,2],"why":"CISG适用须结合营业地、缔约国状态、冲突规范及当事人自治判断。"},{"c":5,"type":"多选","q":"下列哪些是CISG项下卖方的主要义务？","opts":["交付货物","移交有关货物的单据","转移货物所有权（依适用法律及公约相关规则处理）","保证买方无条件转售获利"],"a":[0,1,2],"why":"公约第30条概括卖方交货、交单及转移货物所有权等义务；所有权具体规则仍须结合适用法。"},{"c":5,"type":"多选","q":"关于买方检验与通知义务，下列哪些表述符合CISG框架？","opts":["买方应在实际可行的最短时间内检验货物","发现不符后应在合理时间内通知卖方并具体说明性质","通知期限还受第39条两年最长期间规则约束（除非与保证不符）","买方可以永远不检验且不通知"],"a":[0,1,2],"why":"CISG第38、39条规定检验及不符通知义务，并设有原则上的两年最长期间。"},{"c":6,"type":"填空","q":"提单通常具有货物收据、运输合同证明和____凭证等功能。","a":"物权","why":"提单具有收货证明、运输合同证明及在一定条件下的物权凭证功能。"},{"c":6,"type":"填空","q":"《海牙规则》下承运人的管货责任通常以“钩至钩”描述，其期间从装货开始至____结束。","a":"卸货","why":"课程所述海牙规则管货责任期间通常称钩至钩。"},{"c":6,"type":"填空","q":"承运人在提单上未对货物外表状况作不良批注的提单，通常称为____提单。","a":"清洁","why":"清洁提单是没有关于货物外表状态不良的批注。"},{"c":6,"type":"填空","q":"《海牙规则》承运人责任制度中，驾驶或管理船舶过失在符合规则条件时属于承运人____事项。","a":"免责","why":"海牙规则保留驾驶或管理船舶过失免责，但承运人仍负适航等义务。"},{"c":6,"type":"单选","q":"提单的三项传统功能通常不包括下列哪一项？","opts":["货物收据","运输合同证明","物权凭证","货物买卖合同本身"],"a":3,"why":"提单不是买卖合同本身，而是运输关系中的重要单证。"},{"c":6,"type":"单选","q":"《海牙规则》第3条第1款要求承运人在开航前和开航当时谨慎处理使船舶适航，这属于哪项义务？","opts":["适航义务","交付价款义务","投保义务","买方检验义务"],"a":0,"why":"适航义务包括船舶适于航行、适当配员装备及货舱适货等。"},{"c":6,"type":"单选","q":"倒签提单通常是指？","opts":["实际装船日期早于提单日期","将提单签发日期倒填至早于实际装船日期","货物到港后补发提单","将记名提单改为指示提单"],"a":1,"why":"倒签提单掩盖实际装船迟延，具有虚假记载风险。"},{"c":6,"type":"多选","q":"下列哪些属于提单的常见分类维度？","opts":["是否有不良批注（清洁/不清洁）","是否可转让（记名/指示/不记名）","运输方式（直达/联运/多式联运）","货物是否已经售出"],"a":[0,1,2],"why":"提单可按抬头、批注状态、运输方式等维度分类。"},{"c":6,"type":"多选","q":"《海牙规则》下承运人的核心最低义务包括哪些？","opts":["谨慎处理使船舶适航","适当和谨慎地装载、搬移、配载、运送、保管、照料和卸载货物","对任何原因造成的货损均承担绝对责任","依法享有规则规定的特定免责事由"],"a":[0,1,3],"why":"海牙规则规定适航义务、管货义务及法定免责事由，并非绝对责任制。"},{"c":6,"type":"多选","q":"关于《维斯比规则》对提单制度的调整，下列哪些属于课程讲授内容？","opts":["强化善意第三方持有提单时的证据效力","规定集装箱货物件数或单位的记载问题","对诉讼时效及第三者追偿作出调整","取消承运人责任限制制度"],"a":[0,1,2],"why":"维斯比规则涉及适用范围、集装箱记载、提单证据效力、时效和雇员责任限制等。"},{"c":7,"type":"填空","q":"保险金额低于保险价值的情形，称为____额保险。","a":"不足","why":"保险金额低于保险价值属于不足额保险。"},{"c":7,"type":"填空","q":"保险标的灭失或完全失去原有用途，属于____全损。","a":"实际","why":"实际全损包括灭失、完全失去形体或效用等情形。"},{"c":7,"type":"填空","q":"共同海损要求船货面临共同危险，并为共同安全有意、合理采取措施造成特殊____或费用。","a":"牺牲","why":"共同海损是为共同安全有意合理采取措施所致的特殊牺牲和费用。"},{"c":7,"type":"填空","q":"水渍险的承保范围通常可概括为平安险加自然灾害造成的____损失。","a":"部分","why":"水渍险在平安险基础上增加自然灾害造成的部分损失。"},{"c":7,"type":"单选","q":"下列哪种情形最符合推定全损的判断？","opts":["货物完全灭失且无任何残值","货物虽未完全灭失，但修复费用接近或超过其修复后的价值或保险价值","货物仅发生轻微包装擦痕","货物因市场价格下跌而贬值"],"a":1,"why":"推定全损重在实际全损尚未发生，但修复或救助成本达到法定或约定标准。"},{"c":7,"type":"单选","q":"平安险的传统概括是？","opts":["所有风险均赔","单独海损不赔，但承保范围还包括规则列明的全损、意外事故损失及共同海损等","仅承保战争风险","仅承保一般外来风险"],"a":1,"why":"平安险并非所有损失都赔，传统表述为单独海损不赔。"},{"c":7,"type":"单选","q":"一切险的传统承保范围通常是？","opts":["平安险加水渍险","水渍险加一般附加险","仅平安险加战争险","仅承保自然灾害"],"a":1,"why":"一切险传统概括为水渍险加一般附加险，但仍受除外责任约束。"},{"c":7,"type":"多选","q":"下列哪些条件通常是共同海损成立所要求的？","opts":["船舶、货物等面临共同危险","采取措施具有有意性","措施具有合理性","只要货物发生任何自然腐烂即成立"],"a":[0,1,2],"why":"共同海损须有共同危险、有意且合理的共同安全措施及特殊牺牲或费用。"},{"c":7,"type":"多选","q":"下列哪些属于海上货物运输保险中常见的外来风险或附加险类别？","opts":["偷窃、提货不着、淡水雨淋等一般外来风险","战争险、罢工险等特殊附加险","交货不到险、进口关税险等特别附加险","市场价格波动造成的预期利润损失当然属于承保货损"],"a":[0,1,2],"why":"课件区分一般外来风险、特别附加险和特殊附加险；市场价格波动等间接损失通常属于除外责任。"},{"c":7,"type":"多选","q":"关于海上保险的损失分类，下列哪些表述正确？","opts":["全部损失可分为实际全损和推定全损","部分损失可分为共同海损和单独海损","共同海损要求为共同安全有意合理采取措施","单独海损必然由被保险人故意造成"],"a":[0,1,2],"why":"海上保险损失分类包括全部损失与部分损失，单独海损是承保风险引起且不属于共同海损的部分损失。"}]};
const state={page:'home',chapter:1,tab:'lesson',search:'',done:JSON.parse(localStorage.getItem('ibl_v2_done')||'{}'),wrong:JSON.parse(localStorage.getItem('ibl_v2_wrong')||'[]'),answers:{}};
const $=s=>s.startsWith('#')?document.getElementById(s.slice(1)):document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('ibl_v2_done',JSON.stringify(state.done));localStorage.setItem('ibl_v2_wrong',JSON.stringify(state.wrong));}
function chapter(id){return DATA.chapters.find(x=>x.id===id)}
function go(page){state.page=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
function openChapter(id,tab='lesson'){state.chapter=id;state.tab=tab;state.page='chapter';render()}
function nav(){ $('#chapterNav').innerHTML=DATA.chapters.map(c=>`<button onclick="openChapter(${c.id})"><b>0${c.id}</b>${c.title}</button>`).join('') }
function doneCount(){return Object.values(state.done).filter(Boolean).length}
function render(){nav();let title={home:'国际商法学习中心',courses:'七章课程目录',practice:'章节专项自测',refs:'权威法源与现行法更新',progress:'学习记录'};$('#pageTitle').textContent=state.page==='chapter'?chapter(state.chapter).title:title[state.page];$('#pageSub').textContent=state.page==='chapter'?chapter(state.chapter).subtitle:'以课程资料为主体，结合现行权威法律更新。';let a=$('#app');if(state.page==='home')a.innerHTML=home();else if(state.page==='courses')a.innerHTML=courses();else if(state.page==='chapter')a.innerHTML=chapterView();else if(state.page==='practice')a.innerHTML=practice();else if(state.page==='refs')a.innerHTML=refs();else if(state.page==='progress')a.innerHTML=progress()}
function home(){return `<section class="hero"><h3>从课件知识到法律适用</h3><p>以课程材料为主体，系统讲解七章国际商法知识，结合典型交易场景、易错点、章节练习与现行权威法律更新。重点关注法律规则的适用条件、制度差异和案例分析方法。</p><button class="btn gold" onclick="go('courses')">进入课程学习 →</button></section><div class="stats"><div class="stat"><strong>7</strong><span>课程章节</span></div><div class="stat"><strong>${doneCount()}</strong><span>已标记学完知识点</span></div><div class="stat"><strong>${DATA.quiz.length}</strong><span>章节练习题</span></div></div><div class="notice"><b>学习提示：</b>课程讲解以课件与课程提纲为基础；涉及法律修订、条约适用和规则差异的内容，结合现行权威规范另行提示。</div><div class="headrow"><h3>课程目录</h3><span class="muted">点击章节进入知识讲解、章节练习与法条对照</span></div><div class="grid">${DATA.chapters.map(c=>card(c)).join('')}</div>`}
function card(c){let n=state.done[c.id]||0;return `<div class="card" onclick="openChapter(${c.id})"><div class="num">0${c.id}</div><h3>${c.title}</h3><p>${c.subtitle}</p><div class="bar"><i style="width:${Math.min(100,n*12)}%"></i></div></div>`}
function courses(){return `<div class="grid">${DATA.chapters.map(c=>card(c)).join('')}</div>`}
function chapterView(){let c=chapter(state.chapter);return `<div class="tabs"><button class="active">体系讲解</button><button onclick="go('practice')">章节练习</button><button onclick="state.tab='law';render()">法条与更新</button></div>${state.tab==='law'?lawView(c):lessons(c)}`}
function lessons(c){return `${c.lessons.map((l,i)=>`<article class="lesson"><span class="tag">知识点 ${i+1}</span><h3>${esc(l[0])}</h3><p>${esc(l[1])}</p><p>${esc(l[2])}</p><div class="callout"><b>例子 / 应用：</b>${esc(l[3])}</div><div class="focus"><b>易错点 / 考试提示：</b>${esc(l[4])}</div><button class="btn" onclick="markDone(${c.id},${i})">${state.done[c.id+':'+i]?'✓ 已学完':'标记学完'}</button></article>`).join('')}`}
function lawView(c){let rr=DATA.refs.filter(r=>r.chapters.includes(c.id));return `<div class="lesson"><h3>本章法律依据与更新提示</h3><p>${esc(c.law)}</p><div class="ref">${rr.map(r=>`<a href="${r.url}" target="_blank" rel="noopener">↗ ${esc(r.label)}</a>`).join('')}</div></div><div class="notice">学习时请区分：①课件/笔记原始讲授内容；②现行中国法；③国际公约及其缔约国状态；④国际商会等机构发布的贸易惯例。四类规范的适用基础并不相同。</div>`}
function markDone(c,i){state.done[c+':'+i]=1;save();render()}
function practice(){let c=chapter(state.chapter);let qs=DATA.quiz.filter(q=>q.c===state.chapter);return `<div class="notice">本章练习围绕知识点讲解中的易错点设计，包含法律名词填空、单项选择和多项选择。每章不少于10题，可逐题提交并查看解析。</div>${DATA.chapters.map(x=>`<button class="btn ${state.chapter===x.id?'primary':''}" style="margin:3px" onclick="state.chapter=${x.id};render()">第${x.id}章</button>`).join('')}<div class="headrow"><h3>${c.title} · 章节练习</h3><span class="muted">${qs.length}题</span></div>${qs.map((q,i)=>quizCard(q,i)).join('')}`}
function quizCard(q,i){let key=q.c+':'+i;let multi=q.type==='多选';return `<div class="qcard"><span class="tag">${q.type}</span><h3>${esc(q.q)}</h3>${q.opts?q.opts.map((o,j)=>`<label class="option"><input type="${multi?'checkbox':'radio'}" name="q${key}" value="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join(''):`<input class="searchbar" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px" id="ans${key}" placeholder="输入答案">`}<button class="btn primary" onclick="checkQ('${key}',${q.c},${i})">提交答案</button><div id="fb${key}"></div></div>`}
function checkQ(key,c,i){let q=DATA.quiz.filter(x=>x.c===c)[i];let multi=q.type==='多选';let v=q.opts?(multi?[...document.querySelectorAll('input[name="q'+key+'"]:checked')].map(x=>Number(x.value)).sort((a,b)=>a-b):document.querySelector('input[name="q'+key+'"]:checked')?.value):$('#ans'+key).value.trim();if(v===undefined||v===''||(Array.isArray(v)&&!v.length)){alert('请先作答');return}let ok=multi?(JSON.stringify(v)===JSON.stringify([...q.a].sort((a,b)=>a-b))):q.opts?Number(v)===q.a:String(v).replace(/[\\s，。；;、]/g,'')===String(q.a).replace(/[\\s，。；;、]/g,'');let k='quiz:'+key;if(ok){state.done[k]=1;state.wrong=state.wrong.filter(x=>x!==key)}else if(!state.wrong.includes(key))state.wrong.push(key);save();$('#fb'+key).innerHTML=`<div class="feedback"><span class="${ok?'correct':'wrong'}">${ok?'回答正确':'再检查一下'}</span><br>参考答案：${esc(q.opts?(multi?q.a.map(x=>q.opts[x]).join('；'):q.opts[q.a]):q.a)}<br>${esc(q.why)}</div>`}
function refs(){return `<div class="notice">以下为制作本版时核对的官方或权威来源。网站以学习笔记和PPT为主体，外部法源主要用于纠正旧法引用、补充现行规则和提供进一步阅读入口。</div>${DATA.refs.map(r=>`<div class="lesson"><a href="${r.url}" target="_blank" rel="noopener">↗ ${esc(r.label)}</a><div class="muted">对应章节：${r.chapters.map(x=>'第'+x+'章').join('、')}</div></div>`).join('')}<div class="lesson"><h3>本版重点更新清单</h3><p><b>公司法：</b>使用2023年修订、2024年7月1日起施行的《公司法》。有限责任公司认缴出资原则上五年内缴足；旧笔记中募集设立35%、货币出资30%等历史数字不得直接当作现行法规则。</p><p><b>代理法：</b>对照《民法典》第161—175条及第925—926条，特别区分无权代理、表见代理、追认和间接代理披露。</p><p><b>国际货物买卖：</b>核对CISG适用范围、排除事项、当事人自治、根本违约、检验通知和风险转移；中国有第95条声明，适用路径需谨慎分析。</p><p><b>运输与保险：</b>现行《海商法》为2025年修订、2026年5月1日起施行的版本。运输部分新增电子运输记录等规则；海上保险合同集中规定于第十三章。</p></div>`}
function progress(){return `<div class="panel"><h3>章节学习情况</h3>${DATA.chapters.map(c=>`<div class="lesson"><b>第${c.id}章 ${c.title}</b><div class="muted">已标记知识点：${Object.keys(state.done).filter(k=>k.startsWith(c.id+':')).length}/${c.lessons.length}</div><div class="bar"><i style="width:${Object.keys(state.done).filter(k=>k.startsWith(c.id+':')).length/c.lessons.length*100}%"></i></div></div>`).join('')}</div><div class="panel"><h3>错题记录</h3><p>${state.wrong.length} 道客观题答错记录</p><button class="btn" onclick="if(confirm('确定清除本地学习进度和错题吗？')){localStorage.removeItem('ibl_v2_done');localStorage.removeItem('ibl_v2_wrong');location.reload()}">清除本机记录</button></div>`}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render();
</script></body></html>
